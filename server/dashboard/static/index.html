<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Distri Audio</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>ESP32 Distri Audio</h1>
        <p id="subtitle">Spotify Whole House dashboard</p>
      </div>
      <div class="status-strip" id="service-status"></div>
    </header>

    <nav class="tabs">
      <button class="tab is-active" data-tab="overview">Overzicht</button>
      <button class="tab" data-tab="groups">Groepen</button>
      <button class="tab" data-tab="wifi">Wi-Fi</button>
      <button class="tab" data-tab="quality">Kwaliteit</button>
      <button class="tab" data-tab="logs">Logs</button>
    </nav>

    <main>
      <section id="overview" class="panel is-active">
        <div class="section-head">
          <h2>Devices</h2>
          <button id="refresh">Vernieuwen</button>
        </div>
        <div id="devices-grid" class="devices-grid"></div>
      </section>

      <section id="groups" class="panel">
        <div class="section-head">
          <h2>Groepen</h2>
          <span id="group-hint"></span>
        </div>
        <form id="new-group-form" class="new-group">
          <input id="new-group-name" placeholder="Naam nieuwe groep" autocomplete="off">
          <button type="submit">Groep toevoegen</button>
        </form>
        <div id="groups-list" class="groups"></div>
      </section>

      <section id="wifi" class="panel">
        <div class="section-head">
          <h2>Wi-Fi</h2>
          <span>Verbind een ESP32 met een ander netwerk wanneer de firmware dit ondersteunt</span>
        </div>
        <form id="wifi-form" class="wifi-form">
          <label>
            <span>Device</span>
            <select id="wifi-device"></select>
          </label>
          <label>
            <span>SSID</span>
            <input id="wifi-ssid" placeholder="cc2" autocomplete="off" required>
          </label>
          <label>
            <span>Wachtwoord</span>
            <input id="wifi-password" type="password" autocomplete="new-password">
          </label>
          <button type="submit">Wi-Fi wijzigen</button>
        </form>
      </section>

      <section id="quality" class="panel">
        <div class="section-head">
          <h2>Kwaliteit</h2>
          <span>Laatste 20 minuten</span>
        </div>
        <div class="quality-grid">
          <div>
            <h3>Ping latency</h3>
            <canvas id="ping-chart" width="900" height="320"></canvas>
          </div>
          <div>
            <h3>Connectiviteit</h3>
            <canvas id="connect-chart" width="900" height="180"></canvas>
          </div>
        </div>
      </section>

      <section id="logs" class="panel">
        <div class="section-head">
          <h2>Logs</h2>
          <select id="log-select">
            <option value="snapserver">snapserver</option>
            <option value="librespot">librespot</option>
            <option value="dashboard">dashboard</option>
            <option value="idle-mute">idle-mute</option>
          </select>
        </div>
        <pre id="log-output"></pre>
      </section>
    </main>

    <div id="toast" role="status"></div>
    <script src="/app.js"></script>
  </body>
</html>

services:
  spotify-whole-house:
    build:
      context: .
      dockerfile: server/docker/Dockerfile
    container_name: spotify-whole-house
    network_mode: host
    restart: unless-stopped
    volumes:
      - spotify-whole-house-data:/data
      - spotify-whole-house-cache:/var/cache/librespot
    environment:
      ENABLE_AVAHI: "1"
      ENABLE_IDLE_MUTE: "0"
      DASHBOARD_PORT: "8080"
      SNAPCAST_CLIENTS: "70:4B:CA:25:53:C0,70:4B:CA:24:D7:B4"

volumes:
  spotify-whole-house-data:
  spotify-whole-house-cache:
